<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b5f5a">
    <title>FISIO IF — offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f8f7;
        color: #173b38;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #d8e7e4;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(11 95 90 / 10%);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 10px;
        color: #0b5f5a;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 22px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #0b5f5a;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #f2b84b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/icons/icon.svg" alt="" width="72" height="72">
      <h1>Sem ligação neste momento</h1>
      <p>
        A aplicação ainda não ficou totalmente disponível neste dispositivo. Volte a tentar quando houver
        ligação e mantenha a FISIO IF aberta até terminar o primeiro carregamento.
      </p>
      <a href="./">Tentar novamente</a>
    </main>
  </body>
</html>
